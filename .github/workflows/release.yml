name: Release Windows Build

# v* タグ（例: v1.0.0）を push すると起動し、Windows exe をビルドして Release に添付する。
# workflow_dispatch で既存タグを指定して手動実行することもできる。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release を作成するタグ名（例: v0.1.0）'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # wails build が npm install / vite build / go build をまとめて実行する。
      # frontend/dist が生成されるのはこのステップなので、go test より先に行う
      # （main.go の //go:embed all:frontend/dist がコンパイル時に実体を要求するため）。
      - name: Build Windows binary
        shell: bash
        run: wails build -platform windows/amd64

      # ビルドが通っただけでは中身の正しさは保証されないため、テストも実行する。
      # 上の build で frontend/dist が出来ているのでここでは失敗しない。
      - name: Run tests
        shell: bash
        run: go test ./...

      # exe が大きいため zip 化して添付する。MIT / BSD / Apache いずれも
      # 著作権表示の保持が再頒布条件なので、ライセンス表示物を同梱する。
      - name: Package zip
        shell: pwsh
        run: |
          $staging = "release"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item build/bin/shiboq.exe $staging/
          Copy-Item LICENSE $staging/
          Copy-Item THIRD_PARTY_LICENSES.md $staging/
          Copy-Item README.md $staging/
          Compress-Archive -Path "$staging/*" -DestinationPath build/bin/shiboq-windows-amd64.zip -Force

      - name: Upload zip to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: build/bin/shiboq-windows-amd64.zip
          fail_on_unmatched_files: true
          # Windowsの利用者にはStore版を案内する。未署名のexeはWindows 11の
          # スマート アプリ コントロールにブロックされ得るが、Store版はMicrosoftが署名している。
          # Store版の更新は手動で別途出すため（CLAUDE.md「更新の出し方」）、
          # Store側がこのリリースより古い版のことがある点も書いておく。
          body: |
            ## ダウンロード

            **Windows: [Microsoft Store](https://apps.microsoft.com/detail/9MV10MVFX78Z)**（おすすめ。自動更新されます）

            **ブラウザ: [Web版](https://shiboq.e17.click/)**（インストール不要）

            下の `shiboq-windows-amd64.zip` は署名の無い exe です。Windows 11 のスマート アプリ コントロールに
            ブロックされることがあるため、通常は Store 版を使ってください。
            Store 版はこのリリースより少し遅れて更新されることがあります。
